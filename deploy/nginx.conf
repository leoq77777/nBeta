server {
    listen 80;
    server_name 43.166.2.103.sslip.io;
    location ^~ /.well-known/acme-challenge/ { root /home/ubuntu/projects/nbeta/acme/www; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name 43.166.2.103.sslip.io;
    ssl_certificate /home/ubuntu/projects/nbeta/acme/config/live/43.166.2.103.sslip.io/fullchain.pem;
    ssl_certificate_key /home/ubuntu/projects/nbeta/acme/config/live/43.166.2.103.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location = /nbeta/data/run.json {
        alias /home/ubuntu/projects/nbeta/current/data/run.json;
        add_header Access-Control-Allow-Origin "https://leoq77777.github.io" always;
        add_header Cache-Control "no-store" always;
        limit_except GET HEAD { deny all; }
    }
    location ~ "^/nbeta/snapshots/([0-9TZ-]+[a-f0-9]{8})/data/([a-z_]+)\.(json|csv)$" {
        alias /home/ubuntu/projects/nbeta/snapshots/$1/data/$2.$3;
        add_header Access-Control-Allow-Origin "https://leoq77777.github.io" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        limit_except GET HEAD { deny all; }
    }
    location / { return 404; }
}
